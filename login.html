<!DOCTYPE html>
<html>
<head>
    <title>Teacher Login</title>
    <style>
        body {
            font-family: Arial;
            background: #eef2f3;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-box {
            background: white;
            padding: 30px;
            width: 300px;
            text-align: center;
            border-radius: 8px;
        }
        input, button {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
        }
    </style>
</head>
<body>


<div class="login-box">
    <h2>Teacher Login</h2>
    <input id="name" placeholder="Enter Teacher Name">
    <button onclick="login()">Login</button>
</div>

<script>
function login() {
    const name = document.getElementById("name").value;
    if (name === "") {
        alert("Enter name");
        return;
    }
    localStorage.setItem("teacher", name);
    window.location.href = "dashboard.html";
}
</script>

</body>
</html>
